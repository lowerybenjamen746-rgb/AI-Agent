<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Hermetic fontconfig for native FFmpeg text rendering.
     The runtime replaces @FONT_DIR@ with the staged directory containing the
     bundled font. Do not add a system-font include: the point of this file is
     that text output cannot depend on what the host image happens to install. -->
<fontconfig>
  <dir>@FONT_DIR@</dir>
</fontconfig>
